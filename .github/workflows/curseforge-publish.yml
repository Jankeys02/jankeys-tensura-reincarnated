name: Publish to CurseForge
# Manual only: nothing uploads when you push a tag. After a release is built, go to Actions >
# "Publish to CurseForge" > Run workflow, enter the tag twice (the second time confirms), pick the release type,
# and it uploads that release's client and server zips with their changelogs. Works for older tags too.
# Needs the CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT_ID variable (Settings > Secrets and variables > Actions).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, for example v0.3.0'
        required: true
      confirm:
        description: 'Type the tag again to confirm. This publishes to CurseForge.'
        required: true
      release_type:
        description: 'auto = from the tag (-alpha -> alpha, other suffix -> beta, none -> release)'
        type: choice
        default: auto
        options: [auto, alpha, beta, release]
      client_file_id:
        description: 'Optional: id of a client file already on CurseForge. Skips the client upload and only adds the server zip to it.'
        required: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      CONFIRM: ${{ inputs.confirm }}
      RELEASE_TYPE: ${{ inputs.release_type }}
      CLIENT_FILE_ID: ${{ inputs.client_file_id }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check confirmation and credentials
        run: |
          [ "$TAG" = "$CONFIRM" ] || { echo "::error::The two tag fields differ; nothing was uploaded."; exit 1; }
          [ -n "$CURSEFORGE_TOKEN" ] && [ -n "$CURSEFORGE_PROJECT_ID" ] || { echo "::error::Set the CURSEFORGE_TOKEN secret and CURSEFORGE_PROJECT_ID variable first."; exit 1; }
      # The scripts come from the default branch; only the tag's pack.toml is read from the tag (older tags have no upload script).
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Read the tag's pack.toml and download its release files
        run: |
          git show "refs/tags/$TAG:packwiz/pack.toml" > tag-pack.toml
          gh release download "$TAG" --pattern '*-curseforge.zip' --pattern '*-server.zip' --pattern 'changelog-*.md'
      - name: Upload
        env:
          PACK_TOML: tag-pack.toml
        run: python .github/scripts/curseforge-upload.py "$TAG" *-curseforge.zip *-server.zip
