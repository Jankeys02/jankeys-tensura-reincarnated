name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/packwiz/packwiz@latest
      - name: Export packs
        working-directory: packwiz
        run: |
          # configs, quests and KubeJS ride along in the zip as overrides
          cp -r ../config ../defaultconfigs ../kubejs .
          packwiz refresh
          packwiz curseforge export -o "../jankeys-tensura-${GITHUB_REF_NAME}-curseforge.zip"
          packwiz modrinth export -o "../jankeys-tensura-${GITHUB_REF_NAME}.mrpack"
      - name: Server zip
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/packwiz/pack.toml"
          mkdir -p srv
          cp -r config defaultconfigs kubejs srv/
          cp server/* srv/
          curl -sSL -o srv/packwiz-installer-bootstrap.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          sed -i "s#@PACK_URL@#${URL}#; s#@VERSION@#${GITHUB_REF_NAME}#" srv/install-mods.* srv/README.txt
          (cd srv && zip -qr "../jankeys-tensura-${GITHUB_REF_NAME}-server.zip" .)
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            jankeys-tensura-*-curseforge.zip
            jankeys-tensura-*.mrpack
            jankeys-tensura-*-server.zip
