name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Tag matches package.json version
        run: |
          V=$(python -c "import json;print(json.load(open('package.json'))['version'])")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "::error::package.json says $V but the tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: CurseForge zip
        run: python .github/scripts/export-curseforge.py "${GITHUB_REF_NAME}" "jankeys-tensura-${GITHUB_REF_NAME}-curseforge.zip"
      - name: Server zip
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/packwiz/pack.toml"
          mkdir -p srv
          cp -r config defaultconfigs kubejs srv/
          cp server/* srv/
          curl -sSL -o srv/packwiz-installer-bootstrap.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          sed -i "s#@PACK_URL@#${URL}#; s#@VERSION@#${GITHUB_REF_NAME}#" srv/install-mods.* srv/README.txt
          (cd srv && zip -qr "../jankeys-tensura-${GITHUB_REF_NAME}-server.zip" .)
      - name: Prism dev instance zip
        run: |
          mkdir -p prism-zip/minecraft
          sed 's/\r$//; s/$/\r/' prism/instance.cfg > prism-zip/instance.cfg
          cp prism/mmc-pack.json prism-zip/
          sed 's/\r$//; s/$/\r/' pre-launch.bat > prism-zip/minecraft/pre-launch.bat
          (cd prism-zip && zip -qr "../jankeys-tensura-${GITHUB_REF_NAME}-prism-dev.zip" .)
      - name: Release notes from CHANGELOG.md
        run: python .github/scripts/release-notes.py "${GITHUB_REF_NAME}"
      - name: Pack description (only if it changed)
        run: python .github/scripts/pack-description.py "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            jankeys-tensura-*-curseforge.zip
            jankeys-tensura-*-server.zip
            jankeys-tensura-*-prism-dev.zip
            changelog-client.md
            changelog-server.md
            pack-description.md
