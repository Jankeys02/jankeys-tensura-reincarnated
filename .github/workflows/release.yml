name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CurseForge zip
        run: python .github/scripts/export-curseforge.py "${GITHUB_REF_NAME}" "jankeys-tensura-${GITHUB_REF_NAME}-curseforge.zip"
      - name: Server zip
        run: |
          URL="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/packwiz/pack.toml"
          mkdir -p srv
          cp -r config defaultconfigs kubejs srv/
          cp server/* srv/
          curl -sSL -o srv/packwiz-installer-bootstrap.jar https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          sed -i "s#@PACK_URL@#${URL}#; s#@VERSION@#${GITHUB_REF_NAME}#" srv/install-mods.* srv/README.txt
          (cd srv && zip -qr "../jankeys-tensura-${GITHUB_REF_NAME}-server.zip" .)
      - name: Release notes from CHANGELOG.md
        run: |
          V="${GITHUB_REF_NAME#v}"
          sed 's/\r$//' CHANGELOG.md | awk -v v="$V" 'index($0,"## [" v "]")==1{f=1;next} /^## \[/{f=0} f' > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md for what changed." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            jankeys-tensura-*-curseforge.zip
            jankeys-tensura-*-server.zip
