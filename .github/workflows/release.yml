name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - run: go install github.com/packwiz/packwiz@latest
      - name: Export packs
        working-directory: packwiz
        run: |
          # configs, quests and KubeJS ride along in the zip as overrides
          cp -r ../config ../defaultconfigs ../kubejs .
          packwiz refresh
          packwiz curseforge export -o "../jankeys-tensura-${GITHUB_REF_NAME}-curseforge.zip"
          packwiz modrinth export -o "../jankeys-tensura-${GITHUB_REF_NAME}.mrpack"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            jankeys-tensura-*-curseforge.zip
            jankeys-tensura-*.mrpack
