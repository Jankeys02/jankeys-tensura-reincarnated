name: Mod updates
# Weekly: runs `packwiz update --all` and opens a pull request with whatever changed.
# Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# Review the PR: update-all can pick betas or downgrades. Add a CHANGELOG.md line before merging.
on:
  schedule: [{ cron: '0 6 * * 1' }]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: stable }
      - name: packwiz update --all
        working-directory: packwiz
        run: |
          go install github.com/packwiz/packwiz@latest
          P="$(go env GOPATH)/bin/packwiz"
          "$P" update --all -y
          "$P" refresh
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: bot/mod-updates
          commit-message: Update mods
          title: Update mods
          body: |
            Automatic `packwiz update --all`. Check each changed mod for betas, downgrades or a wrong Minecraft version,
            revert the ones you want to hold back, boot the pack, and add a `CHANGELOG.md` line before merging.
          add-paths: packwiz/**
          delete-branch: true
