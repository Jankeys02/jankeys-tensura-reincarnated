[Discord]
	#Send world-event posts to Discord.
	worldEnabled = true
	#Post the server online/offline announcements (started / stopping). Master 'enabled' still applies on top.
	serverStatusEnabled = true
	#Minimum title rarity posted to the milestone channel: COMMON, UNCOMMON, RARE, EPIC, LEGENDARY, MYTHIC, UNIQUE, HARDCORE, CURSED. Blank disables title posts entirely. Without a floor every common title would post and drown the channel.
	milestoneTitleRarityFloor = "LEGENDARY"
	#Post Harvest Festival entry (the Demon Lord awakening feast) to the world channel.
	tensuraHarvestFestivalEnabled = true
	#Answer read-only commands (e.g. !list, !tps, !uptime, !help) typed in the relay channel. Requires the bot.
	commandsEnabled = true
	#Relay in-game chat to Discord.
	chatEnabled = true
	#Master switch. When false, no Discord traffic is sent or received at all.
	enabled = false
	#Use rich embeds. When false, posts plain text content instead.
	useEmbeds = true
	#Embed accent color for world events (decimal RGB, e.g. 0xE84D4D = 15224141).
	worldColor = 15224141
	#Prefix shown before relayed Discord messages in MC chat. Include any trailing space you want.
	relayPrefix = "[Discord] "
	#Override webhook URL for player milestones (records, achievements). Blank = use default.
	milestoneUrl = ""
	#Prefix that marks a relay-channel message as a bot command.
	commandPrefix = "!"
	#Override webhook URL for world events (calamity, dungeon, awakenings). Blank = use default.
	worldUrl = ""
	#Post player join/leave messages to the world channel (with the player's head avatar). Master 'enabled' + worldEnabled still apply.
	joinLeaveEnabled = true
	#Optional avatar image URL for outbound webhook posts. Blank = webhook default.
	webhookAvatarUrl = ""
	#How often (seconds) to refresh the bot presence. Floored at 15s.
	presenceUpdateSeconds = 60
	#Send milestone posts to Discord.
	milestoneEnabled = true
	#Send player death messages to Discord.
	deathEnabled = true
	#Comma-separated crate ids whose opened reward is posted to the milestone channel. Blank = none.
	milestoneCrateIds = "elite"
	#Name shown for relayed Discord users. true = server display name (guild nickname, falls back to global name then username); false = global display name (falls back to username).
	relayUseServerDisplayName = true
	#Optional display name for outbound webhook posts. Blank = Discord uses the webhook's configured name.
	webhookUsername = ""
	#Override webhook URL for nation / diplomacy events. Blank = use default.
	nationUrl = ""
	#Default webhook URL used by every enabled category that has no override below. Blank = no default.
	defaultWebhookUrl = ""
	#Enable the two-way bot (Discord -> MC chat relay). Requires botToken and relayChannelId.
	botEnabled = false
	#Log every payload and gateway opcode to the server console.
	debug = false
	#Update the bot's Discord presence with the live player count. Requires the bot.
	presenceEnabled = true
	#Send nation/diplomacy posts to Discord.
	nationEnabled = true
	#Presence text. {online} and {max} are substituted; shown in Discord as 'Watching <text>'.
	presenceTemplate = "{online}/{max} online"
	#Embed accent color for chat relay (decimal RGB).
	chatColor = 9807270
	#Post Unique / Ultimate skill masteries to the milestone channel.
	tensuraSkillMasteryEnabled = true
	#Embed accent color for milestones (decimal RGB).
	milestoneColor = 15844367
	#Post Possession skill takeovers to the world channel.
	tensuraPossessionEnabled = true
	#Override webhook URL for in-game chat relay (MC -> Discord). Blank = use default.
	chatUrl = ""
	#Numeric Discord channel ID whose messages relay into in-game chat.
	relayChannelId = ""
	#Post spirit contract upgrades to the milestone channel.
	tensuraSpiritLevelEnabled = true
	#Post race evolutions (e.g. Ogre -> Kijin) to the milestone channel.
	tensuraRaceEvolutionEnabled = true
	#Minimum spirit level posted: LESSER, MEDIUM, GREATER, LORD. Blank posts every upgrade.
	tensuraSpiritLevelFloor = "GREATER"
	#Embed accent color for deaths (decimal RGB).
	deathColor = 2829617
	#Discord bot token. KEEP SECRET. The MESSAGE_CONTENT privileged intent must be enabled in the Developer Portal.
	botToken = ""
	#Override webhook URL for player death messages. Blank = use default.
	deathUrl = ""
	#Embed accent color for nation events (decimal RGB).
	nationColor = 3447003
