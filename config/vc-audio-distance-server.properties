# ==============================================================================
# Voice Physics - server settings
# Changes are applied within 2 seconds, no restart needed.
# The voice and whisper range are set in Simple Voice Chat: max_voice_distance, whisper_distance.
#
# Voice Physics - настройки сервера
# Изменения применяются в течение 2 секунд, перезапуск не нужен.
# Дальность голоса и шёпота задаётся в Simple Voice Chat: max_voice_distance, whisper_distance.
# ==============================================================================

# Format version, do not change. / Версия формата, не меняйте.
settings_version=9

# ---------- 1. Walls, for every player / 1. Стены, для всех игроков --------

# How strongly walls muffle voices, 0 - 1. 0 = walls off. Default 0.6.
# Насколько сильно стены глушат голоса, 0 - 1. 0 = стены выключены. По умолчанию 0.6.
walls_strength=0.6

# How much one block of each material muffles, 0 - 3. Stone = 1.0; 2.0 = like two stone blocks.
# Насколько глушит один блок каждого материала, 0 - 3. Камень = 1.0; 2.0 = как два блока камня.

# stone: stone, bricks, concrete, terracotta, ores: everything mined with a pickaxe. Default 1.0.
# stone: камень, кирпич, бетон, терракота, руда: всё, что добывается киркой. По умолчанию 1.0.
material.stone=1.0

# metal: blocks of iron, gold, copper, netherite and other metal, anvils, iron and copper doors. Default 1.3.
# metal: блоки железа, золота, меди, незерита и другого металла, наковальни, железные и медные двери. По умолчанию 1.3.
material.metal=1.3

# earth: dirt, grass, sand, gravel, clay, mud, snow: everything dug with a shovel. Default 0.9.
# earth: земля, дёрн, песок, гравий, глина, грязь, снег: всё, что копается лопатой. По умолчанию 0.9.
material.earth=0.9

# wood: logs, planks and wooden blocks: everything chopped with an axe. Default 0.7.
# wood: брёвна, доски и деревянные блоки: всё, что рубится топором. По умолчанию 0.7.
material.wood=0.7

# wool: wool and carpets, the best sound insulation. Default 1.4.
# wool: шерсть и ковры, лучшая звукоизоляция. По умолчанию 1.4.
material.wool=1.4

# soft: hay, sponge, moss, sculk, dried kelp: soft blocks that swallow sound. Default 1.2.
# soft: сено, губка, мох, скалк, сушёная ламинария: мягкие блоки, которые поглощают звук. По умолчанию 1.2.
material.soft=1.2

# glass: glass blocks and panes. Default 0.4.
# glass: стеклянные блоки и панели. По умолчанию 0.4.
material.glass=0.4

# ice: ice, packed ice and blue ice. Default 0.7.
# ice: лёд, плотный и синий лёд. По умолчанию 0.7.
material.ice=0.7

# door: wooden doors and trapdoors; an open one counts a tenth. Default 0.6.
# door: деревянные двери и люки; открытая считается на десятую часть. По умолчанию 0.6.
material.door=0.6

# leaves: leaves, let most of the sound through. Default 0.15.
# leaves: листва, пропускает почти весь звук. По умолчанию 0.15.
material.leaves=0.15

# thin: fences, gates and bars, mostly open. Default 0.2.
# thin: заборы, калитки и решётки, почти открытые. По умолчанию 0.2.
material.thin=0.2

# liquid: each block of water or lava. Default 0.35.
# liquid: каждый блок воды или лавы. По умолчанию 0.35.
material.liquid=0.35

# other: every other solid block: bedrock, blocks from other mods and anything not listed above. Default 1.0.
# other: все остальные твёрдые блоки: бедрок, блоки из других модов и всё, чего нет выше. По умолчанию 1.0.
material.other=1.0

# Blocks and block tags that count as a material of their own, e.g. blocks from other mods: id=material or #tag=material, separated by commas.
# A block's own id wins over a tag. Materials: stone, metal, earth, wood, wool, soft, glass, ice, door, leaves, thin, liquid, other. Example: create:andesite_casing=metal,#c:glass_blocks=glass
# Блоки и теги блоков, которые считаются отдельным материалом, например блоки из других модов: id=материал или #тег=материал через запятую.
# Id самого блока сильнее тега. Материалы: stone, metal, earth, wood, wool, soft, glass, ice, door, leaves, thin, liquid, other. Пример: create:andesite_casing=metal,#c:glass_blocks=glass
block_rules=

# ---------- 2. Players without the addon / 2. Игроки без аддона ------------

# true: the server muffles voices through walls for players with plain Simple Voice Chat.
# false: they hear voices without walls. Default true.
# true: сервер глушит голоса за стенами для игроков с обычным Simple Voice Chat.
# false: они слышат голоса без стен. По умолчанию true.
server_walls=true

# Most voices the server muffles at the same time, 0 - 512 (CPU limit).
# Voices above the limit are heard without walls. Default 24.
# Сколько голосов сервер глушит одновременно, 0 - 512 (ограничение нагрузки на процессор).
# Голоса сверх лимита слышно без стен. По умолчанию 24.
server_walls_max_streams=24

# true: they also get water, rain and thunder and the echo of rooms and caves, as set in section 4
# (profile.underwater_*, profile.weather_*, profile.reverb_*). Off by default: every voice it changes
# is re-encoded and counts against the limit above. Default false.
# true: у них также появляются вода, дождь и гроза и эхо комнат и пещер, как настроено в разделе 4
# (profile.underwater_*, profile.weather_*, profile.reverb_*). По умолчанию выключено: каждый изменённый
# голос кодируется заново и учитывается в лимите выше. По умолчанию false.
server_effects=false

# true: far voices get duller with distance, as in air, also for them. Same cost as above. Default false.
# true: далёкие голоса и для них глохнут с расстоянием, как в воздухе. Та же нагрузка. По умолчанию false.
server_air=false

# true: voices fade with the profile's curve (profile.model, profile.attenuation_factor, ...) also for them,
# instead of Simple Voice Chat's straight line. The server can only make a voice quieter, so where the curve
# is louder than that line the voice stays as it was. Same cost as above. Default false.
# true: голоса и для них затихают по кривой профиля (profile.model, profile.attenuation_factor, ...),
# а не по прямой Simple Voice Chat. Сервер может только убавить голос, поэтому там, где кривая громче
# прямой, голос остаётся как был. Та же нагрузка. По умолчанию false.
server_curve=false

# ---------- 3. Players with the addon / 3. Игроки с аддоном ----------------

# What they get from the server:
#   off     - they keep their own settings;
#   suggest - a chat message and an "Apply server profile" button;
#   enforce - the profile below is used while they play here (fair play for PvP and events).
# Default off.
# Что они получают от сервера:
#   off     - остаются со своими настройками;
#   suggest - сообщение в чате и кнопка «Применить профиль сервера»;
#   enforce - профиль ниже действует, пока они играют здесь (честная игра в PvP и на ивентах).
# По умолчанию off.
profile_mode=off

# With enforce: which parts of the profile players cannot change.
#   all, or any of: curve, walls, materials, effects (e.g. "curve, walls").
#   Walls lock the materials' percentages with them. The parts left out stay the player's own. Default all.
# При enforce: какие части профиля игроки не могут менять.
#   all или любые из: curve, walls, materials, effects (например "curve, walls").
#   Стены закрепляют вместе с собой и проценты материалов. Остальные части остаются как у игрока. По умолчанию all.
profile_locked=all

# false: players with the addon see no monitor, no radar and no nearby players in the HUD
# (no seeing through walls in PvP). Their own talking and how many hear them stay. Default true.
# false: у игроков с аддоном нет монитора, радара и игроков рядом в HUD
# (нельзя видеть сквозь стены в PvP). Их собственная речь и сколько их слышат остаются. По умолчанию true.
allow_monitor=true

# The server's sound profile:
#   vanilla   - like plain Simple Voice Chat;
#   realistic - natural falloff;
#   clear     - everyone stays understandable (events, meetings);
#   stealth   - short range, fades fast (hide-and-seek, horror);
#   custom    - the profile.* values below.
# Walls always come from section 1. Default custom.
# Профиль звука сервера:
#   vanilla   - как обычный Simple Voice Chat;
#   realistic - естественный спад;
#   clear     - всех хорошо слышно (ивенты, собрания);
#   stealth   - короткая дальность, быстрый спад (прятки, хоррор);
#   custom    - значения profile.* ниже.
# Стены всегда берутся из раздела 1. По умолчанию custom.
profile_preset=custom

# Custom profile: used only when profile_preset=custom.
# Свой профиль: работает, только когда profile_preset=custom.

# Shape of the curve: linear (as in Simple Voice Chat), realistic_inverse (natural, 1/r),
# exponential (fades fast).
# Форма кривой: linear (как в Simple Voice Chat), realistic_inverse (естественная, 1/r),
# exponential (быстро затихает).
profile.distance_model=linear

# How strongly voices fade with distance, 0 - 1. Lower: voices carry further. Default 1.0.
# Насколько сильно голос затихает с расстоянием, 0 - 1. Меньше - голос слышно дальше. По умолчанию 1.0.
profile.attenuation_factor=1.0

# Share of the range heard at full volume, 0.05 - 1. 0.5: the first half of the range. Default 0.5.
# Доля дальности, где слышно в полную громкость, 0.05 - 1. 0.5 - первая половина дальности. По умолчанию 0.5.
profile.openal_reference_ratio=0.5

# Volume at the edge of the range, 0 - 0.5. 0.1 = 10%, 0 = silence. Default 0.
# Громкость на краю слышимости, 0 - 0.5. 0.1 = 10%, 0 = тишина. По умолчанию 0.
profile.min_volume_fraction=0.0

# How much faster whispers fade, 0.5 - 2. 1 = like normal speech. Default 1.0.
# Во сколько раз быстрее затихает шёпот, 0.5 - 2. 1 = как обычная речь. По умолчанию 1.0.
profile.whisper_multiplier=1.0

# ---------- 4. Echo, water and weather in the profile / 4. Эхо, вода и погода в профиле ----

# Part of the profile above whatever profile_preset says; they only matter when it is suggested or enforced.
# Входят в профиль выше при любом profile_preset; действуют, только когда он рекомендован или закреплён.

# Echo in caves and halls: true / false. Default true.
# Эхо в пещерах и залах: true / false. По умолчанию true.
profile.reverb_enabled=true

# How strong the echo is, 0 - 1. Default 0.6.
# Сила эха, 0 - 1. По умолчанию 0.6.
profile.reverb_strength=0.6

# Voices are dull and quiet when you or the speaker are under water: true / false. Default true.
# Голоса глухие и тихие, когда вы или говорящий под водой: true / false. По умолчанию true.
profile.underwater_enabled=true

# How strong that is, 0 - 1.5 (1 = the usual, 1.5 = half again as dull and quiet). Default 1.
# Насколько сильно, 0 - 1.5 (1 - обычно, 1.5 - в полтора раза глуше и тише). По умолчанию 1.
profile.underwater_strength=1.0

# Rain and thunder cover far voices under the open sky: true / false. Default true.
# Дождь и гроза заглушают дальние голоса под открытым небом: true / false. По умолчанию true.
profile.weather_enabled=true

# How strong that is, 0 - 1.5 (1 = the usual). Default 1.
# Насколько сильно, 0 - 1.5 (1 - обычно). По умолчанию 1.
profile.weather_strength=1.0

# Voices behind a wall come round through a nearby doorway or window: less muffled, from its direction. Default true.
# Голоса за стеной обходят её через ближайший проём или окно: глушатся меньше и слышны с его стороны. По умолчанию true.
profile.diffraction_enabled=true

# Echo and far voices follow the place: deep caves ring more, the Nether is smoky, jungles and snow swallow sound. Default true.
# Эхо и дальние голоса зависят от места: глубокие пещеры звучат гулче, в Незере дымно, джунгли и снег глушат звук. По умолчанию true.
profile.place_tuning=true

# ---------- 5. Zones / 5. Зоны ---------------------------------------------

# A world, a box or a WorldGuard region (Paper) can have its own sound; what a zone leaves out
# comes from the sections above. Where zones overlap, the highest priority wins (then regions, then the
# smallest box); a world's zone applies everywhere else in that world. Boxes are easiest to make in game:
# /vcd zone pos1, /vcd zone pos2, /vcd zone create <name> (or /vcd zone create <name> <radius>).
#   zone.<kind>.<name>.profile_mode      off / suggest / enforce
#   zone.<kind>.<name>.profile_preset    vanilla / realistic / clear / stealth
#   zone.<kind>.<name>.voice_range       voice range here, in blocks (also for players without the addon)
#   zone.<kind>.<name>.whisper_range     whisper range here, in blocks
#   zone.<kind>.<name>.range_multiplier  voice and whisper range times this: 2 = a stage, 0.4 = a library
#   zone.<kind>.<name>.walls_strength    wall strength here, 0 - 1
#   zone.<kind>.<name>.echo              auto (measured), off, or 0.1 - 1 for an echo this big everywhere here
#   zone.<kind>.<name>.isolated          true: voices neither leave nor enter the zone
#   zone.<kind>.<name>.enter_message     shown to players who enter
#   zone.<kind>.<name>.priority          a whole number, default 0
#   zone.box.<name>.world / from / to    the box: world, and two corners as x,y,z
# <kind> is world (on Fabric the dimension: the_nether, the_end...), box, region (WorldGuard) or claim
# (Open Parties and Claims: zone.claim.<player> covers that player's claims and, for a party leader, the
# whole party's; zone.claim.server the server's own claims).
# Мир, бокс или регион WorldGuard (Paper) могут звучать по-своему; чего в зоне нет, берётся из разделов выше.
# Где зоны пересекаются, побеждает высший priority (при равном - регион, затем меньший бокс); зона мира
# действует во всём остальном мире. Боксы проще всего создавать в игре: /vcd zone pos1, /vcd zone pos2,
# /vcd zone create <имя> (или /vcd zone create <имя> <радиус>).
#   profile_mode, profile_preset - как в разделе 3; voice_range, whisper_range - дальность в блоках
#   (и для игроков без аддона); range_multiplier - дальность умножается: 2 - сцена, 0.4 - библиотека;
#   walls_strength - сила стен 0 - 1; echo - auto (как измерено), off или 0.1 - 1: такое эхо везде в зоне;
#   isolated - true: голоса не выходят из зоны и не заходят в неё; enter_message - сообщение при входе;
#   priority - целое число, по умолчанию 0; zone.box.<имя>.world / from / to - мир и два угла бокса x,y,z.
# <kind> - world (на Fabric измерение: the_nether, the_end...), box, region (WorldGuard) или claim
# (Open Parties and Claims: zone.claim.<игрок> - приваты этого игрока, а для лидера группы - всей группы;
# zone.claim.server - приваты самого сервера).

# Players see the zone's name (or its enter_message) above the hotbar when they enter or leave it,
# with or without the addon. Default true.
# Игроки видят название зоны (или её enter_message) над хотбаром при входе и выходе,
# с аддоном и без. По умолчанию true.
zone_notices=true

# ---------- 6. Game rules / 6. Правила игры --------------------------------

# Voice range while sneaking, times this: 0.1 - 1. 1 = no change. Default 1.
# Дальность голоса на корточках умножается на это: 0.1 - 1. 1 = без изменений. По умолчанию 1.
sneak_range_multiplier=1.0

# true: dead players are not heard until they respawn (hardcore, mini-games). Default false.
# true: мёртвых игроков не слышно, пока они не возродятся (хардкор, мини-игры). По умолчанию false.
dead_players_silent=false

# true: spectators are heard only by other spectators. Default false.
# true: наблюдателей слышат только другие наблюдатели. По умолчанию false.
spectators_hear_only_spectators=false

# An item that works as a megaphone while held, e.g. minecraft:goat_horn. Empty = no megaphone.
# Предмет, который в руке работает как мегафон, например minecraft:goat_horn. Пусто = мегафона нет.
megaphone_item=

# Voice range with the megaphone, times this: 1 - 10. Default 2.5.
# Дальность голоса с мегафоном умножается на это: 1 - 10. По умолчанию 2.5.
megaphone_multiplier=2.5

# ---------- 7. Players without the addon: requirement / 7. Игроки без аддона: требование ----

# For players who have Simple Voice Chat but not this addon (or a version below min_addon_version):
#   off     - nothing (default);
#   suggest - one chat message per server start, with where to get it;
#   warn    - the message on every join;
#   kick    - they are disconnected with the message.
# Players without Simple Voice Chat are never affected.
# Для игроков, у которых есть Simple Voice Chat, но нет этого аддона (или версия ниже min_addon_version):
#   off - ничего (по умолчанию); suggest - одно сообщение в чате за запуск сервера, где скачать;
#   warn - сообщение при каждом входе; kick - отключение с этим сообщением.
# Игроков без Simple Voice Chat это не касается.
require_addon=off

# Lowest addon version that counts, e.g. 1.8.0. Empty = any version.
# Минимальная версия аддона, например 1.8.0. Пусто = любая.
min_addon_version=

# Where players get the addon (shown in the message).
# Где игроки берут аддон (показывается в сообщении).
addon_download_url=https://github.com/Shamanalle/voice-physics/releases

# ---------- 8. Messages / 8. Сообщения -------------------------------------

# Language of /vcd replies and of messages to players: auto (each player's own game language),
# or en_us, ru_ru, uk_ua, de_de, es_es, pt_br, zh_cn. Default auto.
# Язык ответов /vcd и сообщений игрокам: auto (язык игры самого игрока)
# или en_us, ru_ru, uk_ua, de_de, es_es, pt_br, zh_cn. По умолчанию auto.
messages_language=auto

# ---------- 9. Simple Voice Chat groups / 9. Группы Simple Voice Chat ------

# Voices inside a group reach its members wherever they are, so walls and range never apply there.
# These choose which game rules do. All default false, except open_group_range.
# Голос внутри группы доходит до её участников где угодно, поэтому стены и дальность там не действуют.
# Здесь выбирается, какие правила игры действуют. Все по умолчанию false, кроме open_group_range.

# true: dead players are not heard by their group either, until they respawn.
# true: мёртвых не слышит и их группа, пока они не возродятся.
group_dead_silent=false

# true: spectators in a group are heard only by the spectators in it.
# true: наблюдателей в группе слышат только наблюдатели этой группы.
group_spectators_apart=false

# true: an isolated zone also cuts group voices between inside and outside.
# true: изолированная зона отрезает и голоса группы между теми, кто внутри и снаружи.
group_isolated_zones=false

# true: in open groups (heard by nearby players too) zone range, sneaking and the megaphone
# work for that nearby voice. Default true.
# true: в открытых группах (их слышат и игроки рядом) дальность зон, корточки и мегафон
# действуют на этот голос рядом. По умолчанию true.
open_group_range=true

# ---------- 10. Muted players / 10. Заглушённые игроки ---------------------

# Players muted with /vcd mute: nobody hears them, nearby or in a group, until the time runs out.
#   mute.<uuid>=<end, epoch ms; 0 = until /vcd unmute>|<name>|<muted by>|<reason>
# Easiest with /vcd mute <player> [time] [reason], /vcd unmute <player> and /vcd mutes. Ended mutes are removed.
# Игроки, заглушённые командой /vcd mute: их никто не слышит, ни рядом, ни в группе, пока не выйдет время.
#   mute.<uuid>=<конец, эпоха в мс; 0 = до /vcd unmute>|<имя>|<кто заглушил>|<причина>
# Проще всего командами /vcd mute <игрок> [время] [причина], /vcd unmute <игрок> и /vcd mutes. Истёкшие удаляются.

# ---------- 11. Statistics / 11. Статистика --------------------------------

# Paper plugin: send anonymous usage numbers to bStats (https://bstats.org): the plugin's version, the
# server software and version, the Java version, the number of players and whether the addon's options are on.
# No names, addresses or chat. The numbers show which versions to keep supporting. Takes effect after a restart.
# Also off for every plugin with plugins/bStats/config.yml (enabled: false). Default true.
# Плагин для Paper: отправлять в bStats (https://bstats.org) анонимные числа об использовании: версию плагина,
# ПО и версию сервера, версию Java, число игроков и включены ли настройки аддона.
# Ни имён, ни адресов, ни чата. Числа показывают, какие версии стоит поддерживать. Действует после перезапуска.
# Выключается и для всех плагинов сразу через plugins/bStats/config.yml (enabled: false). По умолчанию true.
metrics=true

# ---------- 12. Extras for the Paper plugin (off until play-tested) / 12. Дополнения плагина для Paper (выключены, пока не проверены в игре) ----

# true: radio items. A named item with a frequency (/vcd radio, /voice radio): holders on the same
# frequency hear each other at any distance. Default false.
# true: рации. Предмет с частотой (/vcd radio, /voice radio): у кого частота одна, те слышат друг друга на любом расстоянии. По умолчанию false.
server_radio=false

# Item a player must hold (in either hand) to talk and listen on the radio, e.g. minecraft:clock.
# Empty: no item needed, the frequency alone decides. Default empty.
# Предмет, который игрок должен держать (в любой руке), чтобы говорить и слушать по рации, например minecraft:clock.
# Пусто: предмет не нужен, решает одна частота. По умолчанию пусто.
radio_item=

# true: loudspeakers placed with /vcd speaker add repeat voices to the players around them. Default false.
# true: громкоговорители, поставленные через /vcd speaker add, повторяют голоса игрокам вокруг. По умолчанию false.
server_speakers=false

# true: the eavesdrop item makes walls thinner for the player who holds it. Default false.
# true: предмет для подслушивания делает стены тоньше для держащего его игрока. По умолчанию false.
server_eavesdrop=false

# Item a player must hold (in either hand) to eavesdrop, e.g. minecraft:spyglass. Empty: nobody can. Default minecraft:spyglass.
# Предмет, который игрок должен держать (в любой руке), чтобы подслушивать, например minecraft:spyglass. Пусто: никто не может. По умолчанию minecraft:spyglass.
eavesdrop_item=minecraft:spyglass

# How much of the walls' muffling is left for an eavesdropper: 0.05 - 1. 0.3 = a wall sounds about a third as thick. Default 0.3.
# Сколько от приглушения стенами остаётся подслушивающему: 0.05 - 1. 0.3 = стена звучит примерно втрое тоньше. По умолчанию 0.3.
eavesdrop_factor=0.3

# true: a shout is a game event that sculk sensors and wardens react to; whispers and sneaking are not. Default false.
# true: крик - игровое событие, на него реагируют скалковые датчики и вардены; шёпот и корточки - нет. По умолчанию false.
server_sculk=false

# true: a player without the addon hears a voice behind a wall from the doorway it comes through.
# Any failure falls back to the muffled straight path. Default false.
# true: игрок без аддона слышит голос за стеной из дверного проёма, через который тот доходит.
# При любой ошибке остаётся приглушённый прямой путь. По умолчанию false.
server_doorway=false

# true: zone.town.<name> (Towny) and zone.land.<name> (Lands) zones, the WorldGuard region flag vcd-zone
# and the LuckPerms contexts vcd:mode, vcd:walls and vcd:zone work. Each needs its plugin. Default false.
# true: работают зоны zone.town.<имя> (Towny) и zone.land.<имя> (Lands), флаг региона WorldGuard vcd-zone
# и контексты LuckPerms vcd:mode, vcd:walls и vcd:zone. Каждому нужен свой плагин. По умолчанию false.
server_integrations=false

# Loudspeakers, made with /vcd speaker add <name> [radius] [pickup] where the admin stands:
#   speaker.<name>=<world>|<x>|<y>|<z>|<pickup blocks>|<radius blocks>
# Whoever talks within the pickup distance is heard from the speaker by everyone within the radius.
# Громкоговорители, их делает /vcd speaker add <имя> [радиус] [захват] там, где стоит админ:
#   speaker.<имя>=<мир>|<x>|<y>|<z>|<захват, блоков>|<радиус, блоков>
# Кого говорящий в пределах захвата, того слышно из громкоговорителя всем в пределах радиуса.
