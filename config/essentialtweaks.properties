# EssentialTweaks
# Every option defaults to true. Delete this file to regenerate it.

# Default all Essential keybinds to unbound so they cannot clash with other mods.
unbind-keybinds=true

# Keep Essential from claiming the Discord Rich Presence slot.
disable-discord-rpc=true

# Leave Essential's Announcements channel out of the Social tab.
hide-announcement-channel=true

# Suppress update / auto-install popup dialogs on launch. See 'blocked-modals'.
block-startup-modals=true

# Suppress persistent toast notifications.
suppress-persistent-toasts=true

# Suppress in-game promotion banners.
suppress-notice-banners=true

# Suppress wardrobe sale notices.
suppress-sale-notices=true

# Suppress 'new cosmetic' badges.
suppress-cosmetic-notices=true

# Report 'no update available' to Essential's UI, hiding the main-menu update flag, the pause-menu indicator and the settings badge.
hide-update-indicators=true

# Comma-separated modal classes blocked by 'block-startup-modals'.
# If an Essential update introduces a new popup, add its class name here
# rather than rebuilding the mod. The class name is printed by Essential's
# own logs, or can be read from the jar under gg/essential/gui/modals/.
blocked-modals=gg.essential.gui.modals.UpdateNotificationModal,gg.essential.gui.modals.UpdateAvailableModal,gg.essential.gui.modals.EssentialAutoInstalledModal,gg.essential.gui.modals.FeaturesEnabledModal

# Log a report on startup listing which tweaks matched Essential's current
# internals. Leave this on — it is how you find out that an Essential update
# moved something this mod hooks into.
log-diagnostics=true
